name: Build Full ROM (Safe Mode)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi python3 libpng-dev wget unzip

      - name: Setup agbcc
        run: |
          wget https://github.com
          unzip master.zip
          cd agbcc-master
          sh build.sh
          sh install.sh ../
          cd ..

      - name: Get Base ROM
        run: |
          wget -O baserom.gba "https://archive.org"

      - name: Build ROM (Slow & Steady)
        run: |
          make clean
          # בנייה ללא -j כדי לא להעמיס על הזיכרון ולמנוע שגיאה 9
          make

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-Final-GBA
          path: |
            *.gba
            build/noking/*.gba
