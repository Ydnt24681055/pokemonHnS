name: Build ROM
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # משתמש בגרסה v4 כדי למנוע את אזהרת ה-Node.js
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # מוריד אוטומטית תת-תיקיות אם יש כאלו

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi build-essential libpng-dev

      - name: Install agbcc
        run: |
          # אם agbcc כבר קיים כתיקייה, נמחק אותה כדי למנוע שגיאת 128
          rm -rf agbcc
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../
          cd ..

      - name: Build ROM
        run: |
          # בדיקה אם ה-baserom קיים, אם לא - הייצור ייכשל עם הודעה ברורה
          if [ ! -f baserom.gba ]; then
            echo "Error: baserom.gba not found in root directory!"
            exit 1
          fi
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBA-ROM
          path: "*.gba"
          
