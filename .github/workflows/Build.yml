name: Build ROM
on: [push, workflow_dispatch] # ירוץ בכל פעם שתעלה קוד או ידנית

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi build-essential libpng-dev

      - name: Install agbcc
        run: |
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ../

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBA-ROM
          path: "*.gba"
          
