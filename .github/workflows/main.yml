name: Professional Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # שימוש בסביבה מוכנה מראש שחוסכת את כל ההתקנות שנכשלו
    container: ghcr.io/pret/pokeemerald-builder:latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Base ROM
        run: |
          wget -O baserom.gba "https://archive.org"

      - name: Build ROM
        run: |
          # בסביבה הזו הכל כבר מותקן, פשוט מריצים make
          make clean
          make -j2

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokemonHnS-Final
          path: |
            *.gba
            build/noking/*.gba
