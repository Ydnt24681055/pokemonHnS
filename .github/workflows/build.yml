name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../

      - name: Download baserom
        run: |
          # This pulls a clean base Emerald ROM so the compiler can link your changes
          curl -L https://github.com/pret/pokeemerald/raw/master/baserom.gba -o baserom.gba

      - name: Build ROM
        run: |
          make clean
          # IGNORE_CHECK=1 lets it build even if the baserom isn't a perfect 100% match
          make -j$(nproc) WERROR=0 IGNORE_CHECK=1
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemonhns-rom
          # This specifically looks for the main game file
          path: "*.gba"
