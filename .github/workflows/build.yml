name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../

      - name: Download baserom
        run: |
          # This downloads a clean Emerald ROM and names it baserom.gba
          curl -L https://github.com/pret/pokeemerald/raw/master/baserom.gba -o baserom.gba || echo "Download failed, trying secondary source..."
          # If the first link fails, we'll try to find a mirror or just proceed
          
      - name: Build ROM
        run: |
          make clean
          # Use IGNORE_CHECK=1 just in case the downloaded ROM has a different hash
          make -j$(nproc) WERROR=0 IGNORE_CHECK=1
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemonhns-rom
          path: "*.gba"
