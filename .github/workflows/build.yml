name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - checkout
      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../
      - name: Build ROM
        run: |
          make clean
          make -j2 WERROR=0
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemonhns-rom
          # This will search for any .gba file in the whole project
          path: "**/*.gba"
