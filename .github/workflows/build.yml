name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          make clean
          make -j$(nproc) WERROR=0 || true

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemonhns-rom
          path: build/emerald/*.gba
