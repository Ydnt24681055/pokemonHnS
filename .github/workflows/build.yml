name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../

      - name: Build ROM
        run: |
          make clean
          make -j$(nproc) WERROR=0 || true
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemonhns-rom
          # This looks for any GBA file that DOES NOT start with 'mb_' 
          # (to skip those tiny multiboot files)
          path: |
            *.gba
            build/*.gba
            build/emerald/*.gba
