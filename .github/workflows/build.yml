name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc
          cd agbcc
          ./build.sh
          ./install.sh ../
          
      - name: Build ROM
        run: |
          # Create the build folder just in case it's missing
          mkdir -p build/emerald
          make clean
          # We use WERROR=0 and tell make to ignore the exit code 2 if it's just a warning
          make -j$(nproc) WERROR=0 || true
          
     - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemonhns-rom
          # This specifically looks for the main game file in the emerald build folder
          path: "build/emerald/*.gba" 
